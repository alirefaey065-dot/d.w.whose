name: Build Android APK

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بزر ضغطة واحدة

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev lld
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 kivy

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug
        env:
          ACCEPT_ANDROID_SDK_LICENSES: y

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DamyattaWarehouse-APK
          path: bin/*.apk
