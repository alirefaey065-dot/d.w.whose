name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld xclip
        pip install --user --upgrade buildozer cython virtualenv

    - name: Build APK with Buildozer
      run: |
        # 1. مسح أي JAVA_HOME قديم قد يسبب تضارباً
        unset JAVA_HOME
        
        # 2. تعيين المسار الجديد لجافا 17
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        
        # 3. إجبار النظام على استخدام جافا 17 (java و javac)
        sudo update-alternatives --set java /usr/lib/jvm/temurin-17-jdk-amd64/bin/java
        sudo update-alternatives --set javac /usr/lib/jvm/temurin-17-jdk-amd64/bin/javac
        
        # 4. التأكد من النسخة الحالية
        java -version
        
        # 5. تشغيل البناء
        yes | buildozer android debug
