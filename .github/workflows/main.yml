name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld xclip
        pip install --user --upgrade buildozer cython virtualenv

    - name: Build APK with Buildozer
      # نقوم بتعريف JAVA_HOME هنا ليتم استخدامه داخل عملية البناء مباشرة
      env:
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      run: |
        # التأكد من الرابط الافتراضي للجافا (خيار أمان)
        sudo update-alternatives --set java /usr/lib/jvm/temurin-17-jdk-amd64/bin/java
        # تنفيذ البناء
        yes | buildozer android debug
